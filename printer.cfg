# DB600R - custom 600x600 Cartesian printer (moving bed)
# Controller: FYSETC Spider V3.0 (STM32F446), migrated from LDO Leviathan V1.3
# version: 1.0.3  date: 2026-10-03  status: released
#
# Version history: CHANGELOG.md
# Calibration values (probe z_offset, heater PID, bed mesh) are in the
# SAVE_CONFIG block at the end of this file. Do not remove that block.

[include mainsail.cfg]
[include client.cfg]
[include clean_nozzle.cfg]

[mcu]
# Serial ID of this board. It changes when the board is replaced.
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_520055000151333135353334-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[force_move]
enable_force_move: True

#####################################################################
#   Probe -- Spider Z-MAX (PA3). Temporary: microswitch (dry contact)
#####################################################################

[probe]
pin: ^PA3
x_offset: 0
y_offset: 0
speed: 3
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 300,300
speed: 80
z_hop: 5
z_hop_speed: 5

[z_tilt]
z_positions:
    700, 305
    -100, 305
points:
    500, 305
    100, 305
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
speed: 180
horizontal_move_z: 5
mesh_min: 100, 100
mesh_max: 500, 500
probe_count: 3,3
zero_reference_position: 300, 300
fade_start: 0.6
fade_end: 3.0

[screws_tilt_adjust]
screw1: 300, 108
screw1_name: front center
screw2: 80, 108
screw2_name: front left
screw3: 520, 108
screw3_name: front right
screw4: 80, 490
screw4_name: rear left
screw5: 300, 490
screw5_name: rear center
screw6: 520, 490
screw6_name: rear right
screw_thread: CCW-M3
horizontal_move_z: 10
speed: 100

#####################################################################
#   X/Y Steppers -- Spider M0/M1 (TMC2209, UART)
#####################################################################

## X -> M0 (X-MOTOR)
[stepper_x]
step_pin: PE11
dir_pin: PE10
enable_pin: !PE9
microsteps: 16
rotation_distance: 60
endstop_pin: ^!PB14
position_endstop: 0
position_min: 0
position_max: 600
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PE7
run_current: 1.0
hold_current: 0.500

## Y -> M1 (Y-MOTOR)
[stepper_y]
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
microsteps: 16
rotation_distance: 60
endstop_pin: ^!PB13
position_endstop: -20
position_min: -20
position_max: 588
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PE15
run_current: 1.0
hold_current: 0.500

#####################################################################
#   Z Stepper (dual motor, independent drivers) -- Spider M6/M7
#####################################################################

## Z0 -> M6 (E3-MOTOR)
[stepper_z]
step_pin: PD12
dir_pin: !PC4
enable_pin: !PE8
microsteps: 64
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_max: 525
position_min: -6

[tmc2209 stepper_z]
uart_pin: PA15
run_current: 1.0
hold_current: 0.2500

## Z1 -> M7 (E4-MOTOR)
[stepper_z1]
step_pin: PE1
dir_pin: !PE0
enable_pin: !PC5
microsteps: 64
rotation_distance: 2

[tmc2209 stepper_z1]
uart_pin: PD11
run_current: 1.0
hold_current: 0.2500

#####################################################################
#   Extruder -- Spider M3 (E0-MOTOR)
#####################################################################

[extruder]
step_pin: PD5
dir_pin: PD6
enable_pin: !PD4
microsteps: 16
rotation_distance: 48.030
gear_ratio: 9:1
nozzle_diameter: 0.6
filament_diameter: 1.750
heater_pin: PB15
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PC0
min_temp: 0
max_temp: 280
max_power: 1.0
## Spider V3.0 thermistor inputs have 4.7k pull-ups
pullup_resistor: 4700

[tmc2209 extruder]
uart_pin: PD7
run_current: 0.9

[idle_timeout]
timeout: 6000

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PB0
max_power: 1.0
min_temp: 0
max_temp: 130
pwm_cycle_time: 0.02
pullup_resistor: 4700

[verify_heater extruder]
max_error: 120

[verify_heater heater_bed]
max_error: 240
check_gain_time: 120
hysteresis: 35
heating_gain: 0.5

## bed_edge -> TE3 (PC3): sensor taped on the bed glass surface
[temperature_sensor bed_edge]
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
pullup_resistor: 4700
min_temp: 0
max_temp: 130

#####################################################################
#   Fans
#####################################################################

## FAN0 -> hotend (heatbreak) fan. No tachometer: this fan's tach output does not work
[heater_fan hotend_fan]
pin: PA13
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 70.0

## FAN1 -> part cooling fan
[fan]
pin: PA14

## Controller box fans (3): left = FAN2 (PB2), middle = FAN4 (PB6), right = FAN3 (PB5)
## FAN5 (PB7) is not used: the port circuit has failed
[multi_pin driver_fans_pins]
pins: PB5, PB6, PB2

[temperature_fan driver_fans]
pin: multi_pin:driver_fans_pins
sensor_type: temperature_mcu
control: watermark
min_temp: 0
max_temp: 90
target_temp: 45
min_speed: 0.4
max_speed: 0.5

#####################################################################
#   Filament sensors -- BTT SFS V2.0
#####################################################################

[filament_switch_sensor switch_sensor]
switch_pin: ^PA1                  # X-MAX port
pause_on_runout: True
runout_gcode:
    M117 Filament switch runout
insert_gcode:
    M117 Filament switch inserted

[filament_motion_sensor encoder_sensor]
switch_pin: ^PA2                  # Y-MAX port
detection_length: 3.0             # BTT recommended starting value
extruder: extruder
pause_on_runout: True
runout_gcode:
    M117 Filament encoder runout
insert_gcode:
    M117 Filament encoder inserted

#####################################################################
#   Macros
#####################################################################

[gcode_macro PRINT_DONE]
gcode:
  CLEAN_NOZZLE


