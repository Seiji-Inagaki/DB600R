# DB600R - Custom Cartesian Printer
# Leviathan V1.3 -> FYSETC Spider V3.0 移行版
# version: 0.1  date: 2026-09-20  status: 暫定（調整前・未検証値あり）
#
# ピン割当の根拠: DB600R_Spider_V3_ピンアサイン表.md / 設計書7章
# 設定の背景・未検証事項・作業前の注意: DB600R_Spider_V3_移行リリースノート.md
#
# 未検証のまま暫定値を入れている箇所: X/Y の run_current（リリースノート2）、
# dir_pin の極性（同3）、hotend_fan の min_rpm（同7）。
# probe z_offset と両ヒーターのPIDは旧Leviathanの実測値を出発点として置いてある（同4）。
# SAVE_CONFIG ブロックは意図的に空（同4）。

[include mainsail.cfg]
[include client.cfg]
[include clean_nozzle.cfg]

[mcu]
# 2026-09-20 実機で取得（試験項目表F3）。基板交換で変わる（リリースノート1）
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_520055000151333135353334-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

[force_move]
enable_force_move: True

#####################################################################
#   Probe (Klicky, 5V駆動 — Z-MAXの3ピンジャンパーを5Vに設定すること)
#####################################################################

[probe]
pin: ^PA3
x_offset: 0
y_offset: 0
## 仮の出発点（旧Leviathanの実測値）。C12のPROBE_CALIBRATEで確定させる
z_offset: -0.312
speed: 3
samples: 2
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.05
samples_tolerance_retries: 3

[safe_z_home]
home_xy_position: 300,300
speed: 80
z_hop: 5
z_hop_speed: 5

[z_tilt]
z_positions:
    690, 305
    -125, 305
points:
    500, 305
    100, 305
speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075

[bed_mesh]
speed: 180
horizontal_move_z: 5
mesh_min: 100, 100
mesh_max: 500, 500
probe_count: 3,3
fade_start: 0.6
fade_end: 3.0

#####################################################################
#   X/Y Steppers -- Spider M0/M1 (TMC5160→TMC2209。電流値は暫定: リリースノート2)
#####################################################################

## X -> M0 (X-MOTOR)
[stepper_x]
step_pin: PE11
dir_pin: !PE10
enable_pin: !PE9
microsteps: 16
rotation_distance: 60
endstop_pin: ^!PB14
position_endstop: 0
position_min: 0
position_max: 600
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PE7
run_current: 1.0
hold_current: 0.500
stealthchop_threshold: 0

## Y -> M1 (Y-MOTOR)
[stepper_y]
step_pin: PD8
dir_pin: PB12
enable_pin: !PD9
microsteps: 16
rotation_distance: 60
endstop_pin: ^!PB13
position_endstop: -20
position_min: -20
position_max: 615
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PE15
run_current: 1.0
hold_current: 0.500
stealthchop_threshold: 0

#####################################################################
#   Z Stepper (dual motor, independent drivers) -- Spider M6/M7
#####################################################################

## Z0 -> M6 (E3-MOTOR)
[stepper_z]
step_pin: PD12
dir_pin: !PC4
enable_pin: !PE8
microsteps: 64
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_max: 525
position_min: -6

[tmc2209 stepper_z]
uart_pin: PA15
run_current: 1.0
hold_current: 0.2500
stealthchop_threshold: 0

## Z1 -> M7 (E4-MOTOR)
[stepper_z1]
step_pin: PE1
dir_pin: !PE0
enable_pin: !PC5
microsteps: 64
rotation_distance: 2

[tmc2209 stepper_z1]
uart_pin: PD11
run_current: 1.0
hold_current: 0.2500
stealthchop_threshold: 0

#####################################################################
#   Extruder -- Spider M3 (E0-MOTOR)
#####################################################################

[extruder]
step_pin: PD5
dir_pin: !PD6
enable_pin: !PD4
microsteps: 16
rotation_distance: 47.088
gear_ratio: 9:1
nozzle_diameter: 0.6
filament_diameter: 1.750
heater_pin: PB15
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PC0
min_temp: 0
max_temp: 280
max_power: 1.0
pullup_resistor: 2200
## 仮の出発点（旧Leviathanの実測値）。C12のPID_CALIBRATEで確定させる
control: pid
pid_Kp: 38.422
pid_Ki: 4.199
pid_Kd: 87.890

[tmc2209 extruder]
uart_pin: PD7
run_current: 0.9

[idle_timeout]
timeout: 6000

#####################################################################
#   Bed Heater
#####################################################################

[heater_bed]
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PB0
max_power: 1.0
min_temp: 0
max_temp: 130
pwm_cycle_time: 0.02
pullup_resistor: 2200
## 仮の出発点（旧Leviathanの実測値）。C12のPID_CALIBRATEで確定させる
control: pid
pid_Kp: 76.177
pid_Ki: 0.656
pid_Kd: 2211.034

[verify_heater extruder]
max_error: 120

[verify_heater heater_bed]
max_error: 240
check_gain_time: 120
hysteresis: 35
heating_gain: 0.5

## bed_edge -> TE3 (PC3)。旧LeviathanのPA0から移設（リリースノート6）
[temperature_sensor bed_edge]
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC3
pullup_resistor: 2200
min_temp: 0
max_temp: 130

#####################################################################
#   Fans
#####################################################################

## FAN0 -> ホットエンド/ヒートブレイク冷却ファン。タコは Z-MIN(PA0) で受信
## 🚨 B12に合格するまでタコ線をZ-MINへ接続しないこと（リリースノート7）
[heater_fan hotend_fan]
pin: PA13
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 70.0
tachometer_pin: ^PA0
tachometer_ppr: 2
# min_rpm: ???   # TODO: 実測してから設定（意図的にファンを止めて反応を確認すること）

## FAN1 -> パーツ冷却ファン（電圧ジャンパーをファン定格に設定）
[fan]
pin: PA14

## FAN3/FAN4/FAN5 -> コントローラーボックス冷却ファン 3基（左=PB7 / 中=PB6 / 右=PB5）
## multi_pinで一括制御。ポートと実機の対応はC14で確認（リリースノート8）
[multi_pin driver_fans_pins]
pins: PB5, PB6, PB7

[temperature_fan driver_fans]
pin: multi_pin:driver_fans_pins
sensor_type: temperature_mcu
control: watermark
min_temp: 0
max_temp: 90
target_temp: 45
min_speed: 0.4
max_speed: 0.5

#####################################################################
#   Macros
#####################################################################

[gcode_macro PRINT_DONE]
gcode:
  CLEAN_NOZZLE

# --- SAVE_CONFIGブロックは意図的に空欄 ---
# 全軸ホーミング成功後に校正をやり直してから追記させる。手順はリリースノート4（試験項目表C12）
